<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* z-index是显示优先级的属性
        语法：z-index：整数
            取值：
                正整数（如：1.100）：表示较高的层级
                负整数（如：-1.-100）：表示较低的层级
                auto（默认值）：表示不指定z-index，元素按照默认堆叠顺序排列 */
        
        .box1{
            width: 200px;
            height: 200px;
            background-color: pink;
            position: absolute;
            z-index: 1;
        }

        .box2{
            width: 200px;
            height: 200px;
            background-color: red;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
</body>
</html>
