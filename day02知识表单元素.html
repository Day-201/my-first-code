<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- input标签 -->
     <input type="text" > <br>
     <!-- placeholder 提示文本 -->
     placeholder: <input type="text" placeholder="请输入你的名字"> <br>
    
    <!-- value: input:标签的默认值 -->
     value: <input type="text" value="123"><br>

     <!-- name: 给input标签取名字,在某些场景下非常有用 -->
      <input type="text" name="User"><br>

    <!-- disabled：禁用输入框 -->
     disabled：<input type="text" disabled><br>

    <!-- readonly：只读输入框 -->
     readonly：<input type="text" readonly value="张三"><br>
     <hr>
     <h4>type属性有哪些</h4>
     普通文本: <input type="text" ><br>
     密码输入框: <input type="password"><br>
     数字输入框: <input type="number"><br>
     日期输入框: <input type="date"><br>
     复选输入框: <input type="checkbox"><br>
     单选输入框: <input type="radio"><br>
     单选输入框: <input type="radio" name="sex">男
                <input type="radio" name="sex">女<br>
    <!-- name的作用在单选输入框里体现出来了,name后面尽量用英文 -->
     文件类型: <input type="file"><br>
     按钮类型: <input type="button" value="按钮"><br>
     <!-- 一般使用button标签制作按钮 -->
     <button>按钮</button>
    <hr>
    <h3>文本域标签</h3>
    <textarea placeholder="请输入你的留言"></textarea>




</body>
</html>
