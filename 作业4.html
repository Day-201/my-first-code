<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
       .img1{
        width: 100%;
        height: 100vh;
        position: absolute;
        z-index: -1;
       }

       .title{
        height: 60px;
        background-color: white;
        text-align: center;
        position: relative;
        

       }

       .game{
        position: absolute;
        top: 0px;
        padding: 18px 80px;
        background-color: red;
        color: white;
        border: 1px solid  #ccc;
       }

        .recommend{
            position: absolute;
            top: 0px;
            right: 0px;
            padding: 17px 80px;
            border: 1px solid #ccc;
            font-weight: bold;
        }

        .img2{
            box-sizing: border-box;
            margin: 8px;
        }
    </style>
</head>
<body>
    <img class="img1" src="./bg.jpg" >
    <div class="title">
        <img class="img2" src="./main_bg.webp">
        <div class="game">游戏全目录</div>
        <div class="recommend">热点推荐</div>
    </div>
</body>
</html>
