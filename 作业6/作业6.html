<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        body{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .watch{
            width: 300px;
            height: 400px;
            border-radius: 20px;
            box-shadow: 0px 0px 22px -1px #ccc;
            overflow: hidden;
            transition: all 0.5s ease;
            /* margin-left: 40px; */
        }

        .watch:hover{
            box-shadow: 0px 0px 22px 10px #ccc;
            transform: translate(0px,-6px);
        }

        .picture{
            width: 100%;
            height: 50%;
            overflow: hidden;
        }

        .picture img{
            width: 100%;
            height: 100%;
            transition: all 0.5s ease;
        }

        .watch:hover img{
            transform: scale(1.3);
        }

        .content{
            padding: 20px;
        }

        .content p{
            color: #666;
            margin-top: 10px;
            margin-bottom: 10px;
            
        }

        .number span:nth-child(1){
            color: red;
            font-weight: bold;
            font-size: 20px;
        }

        .number span:nth-child(2){
            color: #ccc;
            font-size: 14px;
            margin-left: 6px;

        }

        .btns{
            display: flex;
            height: 40px;
            /* justify-content: space-evenly; */
            gap:10px;
            margin-top: 10px;
        }

        .btns button{
            border-radius: 6px;
            border: none;
            color: #fff;
            font-weight: bold;
            /* 为了他们的宽度起点相同,使得瓜分平等 */
            width: 0px;
            flex-grow: 1;
            /* padding: 10px 30px; */
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .btns button:nth-child(1){
            background-color: green;
        }

        .btns button:nth-child(2){
            background-color: red;
        }

        .btns button:hover{
            background-color: #ccc;
            transform: translate(0px,-6px);
        }
    </style>
</head>
<body>
        <!-- 商品介绍 -->

    </div>
