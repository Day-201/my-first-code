    // <!-- 第二题：用循环实现1到n之间所有的偶数和（包括n） -->
    function sumEvenNumbers(n){
        let sum = 0
        for(let i = 1;i <= n; i++){
            if(i % 2 === 0 ){
                sum = sum + i
            }
            
        }
        console.log(sum);
        
        return sum
    }
    let second_result = sumEvenNumbers()

    // 第三题：判断该月份属于什么季节
    function isSeason(num){
        if(num >= 3 && num <= 5){
            console.log('春季');
        }else if(num >= 6 && num <= 8){
            console.log('夏季');
        }else if(num >= 9 && num <= 11){
            console.log('秋季');
        }else if(num = 12 || num <= 2 && num > 0){
            console.log('冬季');
        }
        
    }
    isSeason()
