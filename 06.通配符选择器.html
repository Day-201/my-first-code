<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 通配符选择器
            格式:*{}
            两个属性:margin是去除标签的外边距
                    padding是去除标签的内边距 */
        *{
            /* 将所有标签的默认间距清空 */
            margin: 0px;
        }
    </style>
</head>
<body>
     <h1>hello</h1>
    <h1>hello</h1>
    <h1>hello</h1>
    <p>world</p>
    <p>world</p>
    <p>world</p>
    <div>
        <h1>hello</h1>
        <h1>hello</h1>
        <p>world</p>
        <p>world</p>
        <p>world</p>
        <p>world</p>
        <p>world</p>
</body>
</html>
