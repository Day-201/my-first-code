<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* border-radius是边框圆角属性
            给他赋的值越大他越圆
            大小为正方形的盒子最后会变成圆形
            大小为长方形的盒子最后会变成椭圆        
        */
        
       .box{
       border: 3px solid red;
       width: 200px;
       height: 200px;
        overflow: auto;
        border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        
    </div>
</body>
</html>
