<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* border-radius是边框圆角属性
            给他赋的值越大他越圆
            大小为正方形的盒子yingy最后会变成圆形
            大小为长方形的盒子最后会变成椭圆        
        */
        
       .box{
       border: 3px solid red;
       width: 200px;
       height: 200px;
        overflow: auto;
        /* 盒子阴影
            box-shadow
            写法：box-shadow:offset-x offset-y blur-radius spread-radius color inset
            offset-x水平偏移量（正向右，负向左）
            pffset-y垂直偏移量（正向下，负向上）
            blur-radius模糊程度（可选，默认为0）值越大，阴影越模糊
            spread-radius扩展半径（可选，默认为0）正值扩大阴影，负值缩小阴影
            color阴影颜色（可选，默认为黑色）
            inset内阴影关键字（可选），如果指定则阴影出现在元素内部  
        */
        /* box-shadow: 0px 0px 20px 20px black inset; */
        }

        .box:hover{
            box-shadow: 0px 0px 20px 20px black

        }
    </style>
</head>
<body>
    <div class="box">
        
    </div>
</body>
</html>
