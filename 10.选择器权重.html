<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            color: green;
        }

        /* !important是选择器里权重最高的,其他选择器无法覆盖他 */
        h1{
            color: red !important
        }

        
    </style>
</head>
<body>
    <h1 class="box">hello</h1>
</body>
</html>
