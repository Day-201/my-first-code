    <h1>李白简介</h1>
    <hr>
    <p>&nbsp;&nbsp;&nbsp;&nbsp;<b>李白</b><i>（701年——762年）</i>，中国唐代浪漫主义诗人，字太白，号青莲居士，又号“谪仙”，后世称“诗仙”“诗侠”。其出生地有蜀郡绵州昌隆县（今四川绵阳江油青莲镇）
    、西域碎叶等说法，祖籍陇西成纪（今甘肃天水秦安县），也有山东人之说，一说为李暠九世孙</p>
    <p>&nbsp;&nbsp;&nbsp;&nbsp;<b>主要成就：</b>是中国古代浪漫主义文学高峰，歌行体与七绝创作达到唐代巅峰，与杜甫并称“李杜”。作品突破传统诗歌创作格式，对后世诗人影响深远，在词体发展史上被视为开山人物</p>
    <br>
    <br>
    &nbsp;&nbsp;&nbsp;&nbsp;代表作有《<b>望庐山瀑布</b>》
