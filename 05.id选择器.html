<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 跟类选择器差不多,是#加上id */
        #abc{
            color: red;
        }

       
    </style>
</head>
<body>
    <!-- 一个标签id名只有一个,并且不能重复 -->
    <h1 id="abc ">hello</h1>
    <h1>hello</h1>
    <h1>hello</h1>
    <p>world</p>
    <p>world</p>
    <p>world</p>
    <div>
        <h1>hello</h1>
        <h1>hello</h1>
        <p>world</p>
        <p>world</p>
        <p>world</p>
        <p>world</p>
        <p>world</p>
</body>
</html>
