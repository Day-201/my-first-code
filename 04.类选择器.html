<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 类选择器:用class进行标签的类名,写选择器时用.加上类名就是类名选择器 -->
    <style>
        .abc{
            color: red;
        }

        .hhh{
            background-color: pink;
        }
    </style>
</head>
<body>
    <!-- 一个标签可以有多个类名中间要用空格分隔 -->
    <h1 class="abc hhh">hello</h1>
    <h1>hello</h1>
    <h1>hello</h1>
    <p>world</p>
    <p>world</p>
    <p>world</p>
    <div>
        <h1>hello</h1>
        <h1>hello</h1>
        <p>world</p>
        <p>world</p>
        <p>world</p>
        <p>world</p>
        <p>world</p>
    </div>
</body>
</html>
