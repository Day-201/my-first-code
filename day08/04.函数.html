<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1, 内置函数
        //  就像alert()


        // 2. 自定义函数
        // 定义语法：
        // function 函数名(形参1，形参2...){     //注意function与函数名之间是要有空格隔开
        //     函数的代码块
        // }

        // 自定义之后需要调用才能用自定义的函数
        
        // 调用语法：
        // 函数名(实参1，实参2...)

        // 定义函数
        // function a( ){
        //     console.log('a函数被调用');
        //     console.log('a函数被调用');
        //     console.log('a函数被调用');
        // }

        // 调用函数: 就是进入这个函数里面，把里面的代码块执行
        // a()

        // 2. 函数的参数
        function func(a,b,c){
            console.log(a);
            console.log(b);
            console.log(c);
        }

        func(1, 2, 3)


        // 形参就相当于去声明变量，实参就相当于给形参赋值

        // 案例： 制作一个计算任意两数之和的函数
        function add(a, b){
            c = a + b
            console.log(c);
        }
        add(2,4)


        // 3. 函数的返回值
        // 由于作用域的问题， 函数外面没有办法访问到函数里面的变量
        function add(a, b){
            let c = a + b
            console.log(c);

            return c
        }
         // 如何将函数的结果保存起来？
        let result = add(2,4)
        // return的作用将函数的变量拿到外面也可以使用

        // 4，匿名函数
        let func = function(){
            console.log('匿名函数');
        }
        // 调用：
        func()
       
    </script>
</body>
</html>
