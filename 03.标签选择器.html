<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 标签选择器的标签指的就是大括号前面的选择器是用body里面的标签 -->
    <style>
        h1{
            color: red;
        }

        p{
            color: red;
        }
    </style>
</head>
<body>
    <h1>hello</h1>
    <h1>hello</h1>
    <h1>hello</h1>
    <h1>hello</h1>
    <p>world</p>
    <p>world</p>
    <p>world</p>
    <p>world</p>
    <p>world</p>
    <!-- 
        div标签是一个块级标签独占一行,可以理解为是一个空容器用来包裹其他的标签
         -->
    <div>
        <h1>hello</h1>
        <h1>hello</h1>
        <p>world</p>
        <p>world</p>
        <p>world</p>
        <p>world</p>
        <p>world</p>
    </div>
</body>
</html>
